apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: cleanup
spec:
  workspaces:
    - name: source
  steps:
    - name: clean
      image: registry.access.redhat.com/ubi9/ubi-minimal
      script: |
        #!/usr/bin/env sh
        set -eu
        find "$(workspaces.source.path)" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: flake8
spec:
  workspaces:
    - name: source
  steps:
    - name: lint
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        pip install --no-cache-dir flake8
        flake8 app.py tests
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: nose
spec:
  workspaces:
    - name: source
  steps:
    - name: test
      image: python:3.12-slim
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        python -m unittest discover -s tests -v
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
spec:
  params:
    - name: IMAGE
      type: string
  workspaces:
    - name: source
  steps:
    - name: build-and-push
      image: quay.io/buildah/stable:v1.36
      securityContext:
        privileged: true
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        buildah bud --storage-driver=vfs -t "$(params.IMAGE)" .
        buildah push --storage-driver=vfs "$(params.IMAGE)"
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy
spec:
  params:
    - name: IMAGE
      type: string
  steps:
    - name: deploy
      image: quay.io/openshift/origin-cli:4.16
      script: |
        #!/bin/sh
        set -eu
        oc create deployment demoo --image="$(params.IMAGE)" --dry-run=client -o yaml | oc apply -f -
        oc set env deployment/demoo PORT=8000
        oc expose deployment demoo --port=8000 --target-port=8000 --name=demoo || true
        oc rollout status deployment/demoo --timeout=180s
---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: demoo-pipeline
spec:
  params:
    - name: url
      type: string
      description: Git repository URL
    - name: revision
      type: string
      default: main
    - name: IMAGE
      type: string
      description: Fully qualified image reference to push
  workspaces:
    - name: shared-data
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup
      workspaces:
        - name: source
          workspace: shared-data
    - name: git-clone
      runAfter: [cleanup]
      taskRef:
        name: git-clone
      params:
        - name: url
          value: $(params.url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: shared-data
    - name: flake8
      runAfter: [git-clone]
      taskRef:
        name: flake8
      workspaces:
        - name: source
          workspace: shared-data
    - name: nose
      runAfter: [flake8]
      taskRef:
        name: nose
      workspaces:
        - name: source
          workspace: shared-data
    - name: buildah
      runAfter: [nose]
      taskRef:
        name: buildah
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: shared-data
    - name: deploy
      runAfter: [buildah]
      taskRef:
        name: deploy
      params:
        - name: IMAGE
          value: $(params.IMAGE)
